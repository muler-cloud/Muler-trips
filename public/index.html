<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelSplit Euro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Стили для гарантированного увеличения шрифтов во всем приложении */
        body {
            font-size: 1.25rem; /* Увеличиваем базовый шрифт */
        }
        input, button, select {
            font-size: 1.25rem !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div id="main-screen" class="max-w-md mx-auto px-4 py-8">
        <h1 class="text-4xl font-black text-blue-700 text-center mb-8 tracking-tight">TRAVELSPLIT €</h1>
        
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">Мои поездки</h2>
            <button onclick="createNewTrip()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 px-6 rounded-xl transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
                <span>+ Новая поездка</span>
            </button>
        </div>

        <div id="trips-list" class="space-y-4"></div>
    </div>

    <div id="trip-screen" class="hidden max-w-md mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <button onclick="showMainScreen()" class="text-blue-600 font-bold hover:underline flex items-center gap-1">
                ← Назад
            </button>
            <h1 id="trip-title" class="text-3xl font-black text-gray-800 tracking-tight">Поездка</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 mb-6 border border-gray-100">
            <h3 class="text-xl font-black text-gray-700 mb-4 uppercase tracking-wider">Участники</h3>
            <div id="participants-list" class="flex flex-wrap gap-2 mb-4"></div>
            
            <div class="flex gap-2">
                <input type="text" id="participant-name" placeholder="Имя участника" class="flex-1 border-2 border-gray-200 rounded-xl px-4 py-3 focus:border-blue-500 focus:outline-none font-medium">
                <button onclick="addParticipant()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black px-6 py-3 rounded-xl transition">
                    + Добавить
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 mb-6 border border-gray-100">
            <h3 class="text-xl font-black text-gray-700 mb-4 uppercase tracking-wider">Баланс и расчеты</h3>
            <div id="balance-output" class="space-y-2 text-xl font-bold text-gray-600 italic">
                Нет участников для расчета баланса.
            </div>
        </div>
    </div>

    <script>
        let currentTripId = null;
        let currentTripData = null;

        // При загрузке страницы сразу запрашиваем список поездок из базы данных
        document.addEventListener('DOMContentLoaded', loadAllTrips);

        // 1. Загрузка всех поездок с сервера
        async function loadAllTrips() {
            try {
                const response = await fetch('/api/trips');
                if (!response.ok) throw new Error('Ошибка сервера при получении списка');
                
                const trips = await response.json();
                const listContainer = document.getElementById('trips-list');
                listContainer.innerHTML = '';

                if (trips.length === 0) {
                    listContainer.innerHTML = `<p class="text-center text-gray-400 font-medium py-4">У вас пока нет созданных поездок.</p>`;
                    return;
                }

                trips.forEach(trip => {
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-white hover:bg-gray-50 text-left font-black text-2xl py-5 px-6 rounded-xl shadow-sm border border-gray-100 transition flex justify-between items-center";
                    btn.onclick = () => openTrip(trip);
                    btn.innerHTML = `
                        <span class="text-gray-800">${trip.name}</span>
                        <span class="text-blue-500 text-xl">→</span>
                    `;
                    listContainer.appendChild(btn);
                });
            } catch (err) {
                console.error('Не удалось загрузить поездки:', err);
            }
        }

        // 2. Создание новой поездки
        async function createNewTrip() {
            const name = prompt('Введите название поездки:', 'Мое путешествие');
            if (!name || name.trim() === '') return;

            try {
                const response = await fetch('/api/trips', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name.trim() })
                });

                if (!response.ok) throw new Error('Ошибка при сохранении поездки в базу');

                const savedTrip = await response.json();
                
                // ВАЖНО: MongoDB возвращает ID в поле `_id`
                if (savedTrip && savedTrip._id) {
                    openTrip(savedTrip);
                } else {
                    alert('Ошибка: сервер не вернул ID поездки.');
                }
            } catch (err) {
                console.error('Ошибка создания поездки:', err);
                alert('Не удалось создать поездку. Проверьте соединение с сервером.');
            }
        }

        // 3. Открытие экрана конкретной поездки
        function openTrip(trip) {
            currentTripId = trip._id; // Фиксируем правильный ID из базы данных
            currentTripData = trip;

            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('trip-screen').classList.remove('hidden');
            
            document.getElementById('trip-title').innerText = trip.name;
            document.getElementById('participant-name').value = '';

            renderParticipantsAndBalance();
        }

        // 4. Добавление участника в текущую поездку
        async function addParticipant() {
            const input = document.getElementById('participant-name');
            const name = input.value.trim();

            if (!name) return;
            if (!currentTripId || currentTripId === 'undefined') {
                alert('Ошибка: ID поездки не определен!');
                return;
            }

            // Добавляем имя в наш локальный массив данных
            if (!currentTripData.participants) currentTripData.participants = [];
            currentTripData.participants.push(name);

            try {
                // Отправляем обновленный массив участников на сервер
                const response = await fetch(`/api/trips/${currentTripId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participants: currentTripData.participants,
                        expenses: currentTripData.expenses
                    })
                });

                if (!response.ok) throw new Error('Ошибка обновления данных на сервере');

                const updatedTrip = await response.json();
                currentTripData = updatedTrip; // Обновляем локальные данные ответом сервера

                input.value = ''; // Очищаем поле ввода
                renderParticipantsAndBalance(); // Перерисовываем экран
            } catch (err) {
                console.error('Не удалось добавить участника:', err);
                alert('Ошибка при сохранении участника на сервере.');
                // Откатываем локальное добавление в случае ошибки
                currentTripData.participants.pop();
            }
        }

        // 5. Отрисовка списка участников и расчет крупного баланса
        function renderParticipantsAndBalance() {
            const pList = document.getElementById('participants-list');
            pList.innerHTML = '';

            const parts = currentTripData.participants || [];

            if (parts.length === 0) {
                pList.innerHTML = `<span class="text-gray-400 font-medium py-2">Участников пока нет</span>`;
                document.getElementById('balance-output').innerHTML = `<div class="text-xl text-gray-400 font-bold italic">Добавьте участников для расчетов.</div>`;
                return;
            }

            // Выводим участников большими кнопками-плашками
            parts.forEach(p => {
                const badge = document.createElement('span');
                badge.className = "bg-blue-50 text-blue-800 text-2xl font-black px-5 py-3 rounded-xl border border-blue-200 shadow-sm";
                badge.innerText = p;
                pList.appendChild(badge);
            });

            // Формируем блок баланса крупными буквами
            const balanceContainer = document.getElementById('balance-output');
            balanceContainer.innerHTML = '';

            parts.forEach(p => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-center py-3 border-b border-gray-100 last:border-0";
                row.innerHTML = `
                    <span class="text-2xl font-black text-gray-800">${p}</span>
                    <span class="text-2xl font-black text-emerald-600">0.00 €</span>
                `;
                balanceContainer.appendChild(row);
            });
        }

        // 6. Возврат на главный экран
        function showMainScreen() {
            document.getElementById('trip-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            currentTripId = null;
            currentTripData = null;
            loadAllTrips(); // Обновляем список поездок на главном экране
        }
    </script>
</body>
</html>
